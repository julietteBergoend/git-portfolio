<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" fill="none">
  <defs>
    <linearGradient id="speaker-stroke" x1="120" y1="100" x2="280" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75E7FF"/>
      <stop offset="1" stop-color="#C9A7FF"/>
    </linearGradient>
    <linearGradient id="recipient-stroke" x1="520" y1="100" x2="680" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF8BFF"/>
      <stop offset="1" stop-color="#C9A7FF"/>
    </linearGradient>
    <linearGradient id="direction" x1="275" y1="215" x2="527" y2="215" gradientUnits="userSpaceOnUse">
